# Conformance ledger: official ODCS v3.2.0 examples the library rejects as published.
#
# One entry per example (path under odcs-v3.2.0/examples/). The runner fails when
# an example is rejected without an entry, or when an entry has gone stale.
#
#   example    the example file
#   reason     the decision (D<n>) that keeps the divergence, the task (ODCS-<n>)
#              that removes it, or upstream-kcl for a defect in KCL itself
#   normalize  optional rewrite steps (apiVersion, dataProduct, team); the rewritten
#              copy must validate, so the rest of the example is still checked
#   expect     optional message fragment the published example must be rejected with
#
# Entries only ever leave this file, in the change that fixes them. The release
# criterion caps what may remain: D2 and D5 entries and upstream-kcl defects.

- example: all/full-example.odcs.yaml
  reason: D5, the deprecated dataProduct is omitted
  normalize: [dataProduct]
- example: all/postgresql-adventureworks-contract.odcs.yaml
  reason: D2, declares an older apiVersion; the library accepts v3.2.0 only
  normalize: [apiVersion]
- example: data-types/all-data-types.odcs.yaml
  reason: D2, D5, an older apiVersion and the deprecated dataProduct
  normalize: [apiVersion, dataProduct]
- example: fundamentals/table-column-description.odcs.yaml
