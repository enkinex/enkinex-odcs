# Negative map: each official ODCS v3.2.0 negative test, and the message fragment
# its rejection must contain (kcl's output, colour codes stripped).
#
#   test     the file under odcs-v3.2.0/negative/
#   expect   the fragment naming the rule the test targets, not merely any error
#   pending  optional task (ODCS-<n>) that implements the rule; until it lands, any
#            rejection is tolerated, and once the fragment matches the gate fails
#            until this key is removed
#
# An exit code alone cannot tell "rejected by the rule" from "rejected because the
# feature is unknown", which is why every entry names its fragment.

- test: additional-unknown-property.odcs.yaml
  expect: Cannot add member 'unknownRootField'
- test: btrieve-missing-host.odcs.yaml
  expect: zen server requires 'host' and 'database'
  pending: ODCS-11
