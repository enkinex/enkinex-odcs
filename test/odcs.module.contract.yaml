# Test for the `contract` module: Description, Pricing,
# ServiceLevelAgreement and Support, plus the root contract fundamentals.
apiVersion: v3.2.0
kind: DataContract
id: c47a1e10-0003-4c00-8000-0000000000c3
name: Contract Module Test
version: 1.0.0
status: in development # open since ODCS v3.2.0: any string

# Root fundamentals owned by odcs.k (optional metadata + ISO-8601 timestamp check)
tenant: EnkinexOrg
domain: sales
# RFC 0050: a whole variable reference passes the timestamp check, resolved downstream
contractCreatedTs: ${CONTRACT_CREATED_AT}

# RFC 0038: contract-level AI context in object form
context:
  instructions: Curated orders for analytics; prefer the orders object over raw sources.
  verifiedStatements:
    - question: What is the grain of this contract?
      answer: One row per confirmed sales order.

# Description with every direct field set
description:
  purpose: Curated sales orders for downstream analytics in ${ENVIRONMENT:-production}.
  limitations: Not suitable for real-time decisioning.
  usage: Refresh dashboards once a day, after the morning load.

# Pricing with the optional stable id and a float amount
price:
  id: standard_pricing
  priceAmount: 9.95
  priceCurrency: USD
  priceUnit: megabyte

# SLA entries: minimal (property + value), complete (every optional field), then scalar value variations
slaProperties:
  - property: latency
    value: 4

  # RFC 0046: SLA entries carry authoritativeDefinitions and customProperties
  - id: sla_availability
    property: availability
    value: 99.5
    unit: "%"
    authoritativeDefinitions:
      - type: businessDefinition
        url: https://enkinex.org/sla/availability
    customProperties:
      - property: alertPolicyId
        value: pol-123

  - id: sla_retention
    property: retention
    value: 3
    valueExt: 6
    unit: y
    element: orders.order_ts
    driver: regulatory
    description: Orders are retained three years, extendable to six.
    scheduler: cron
    schedule: "0 20 * * *"

  - property: generalAvailability
    value: "2026-05-12T09:30:10-08:00"
  - property: uptime
    value: 99.9
    unit: percent
    driver: operational
  - property: piiMasked
    value: true
    driver: analytics

# Support channels: minimal (channel only) and complete (every optional field)
support:
  - channel: sales-data-help

  - id: announcements_channel
    channel: sales-data-announcements
    url: https://enkinex.org/support/teams/sales-data-announcements
    description: Announcement-only channel for contract consumers.
    tool: teams
    scope: announcements
    invitationUrl: https://enkinex.org/support/teams/sales-data-announcements/invite
    customProperties:
      - property: serviceHours
        value: 9-5 UTC
